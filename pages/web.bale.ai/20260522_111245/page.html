    <style>
      body {
        font-family: Shabnam;
        font-size: 1.6rem;
        background-color: var(--color-neutrals-n-00);
        margin: 0;
        overflow: hidden;
        height: calc(var(--vh, 1vh) * 100);
      }

      #root {
        height: 100%;
        background-color: var(--color-neutrals-n-00);
      }
      .oval_container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .splash-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2rem;
        padding: 1rem;
      }

      @media (min-width: 992px) {
        .splash {
          max-width: 400px;
        }
      }

      .splash > .logo {
        width: 150px;
        display: block;
      }

      .splash > .description {
        font-size: 1rem;
        text-align: center;
        line-height: 1.5;
      }

      .spin {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }
    </style>
