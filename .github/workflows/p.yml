name: p

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      quality:
        description: 'Video quality (yt-dlp format selector)'
        required: true
        type: string
        default: 'bestvideo[height<=720]+bestaudio/best[ext=mp4]/best'
      archive_name:
        description: 'Base name for the RAR archive (if file is split)'
        required: false
        type: string
        default: 'video'
      cookies:
        description: 'Cookies file content (base64 encoded) - optional'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install latest yt-dlp and tools
        run: |
          pip install -U yt-dlp
          pip install -U yt-dlp[default]
          sudo apt-get update
          sudo apt-get install -y bc wget curl ffmpeg jq
          # نصب yt-dlp از آخرین نسخه
          pip install --upgrade --no-cache-dir yt-dlp

      - name: Setup cookies (if provided)
        if: ${{ github.event.inputs.cookies != '' }}
        run: |
          echo "${{ github.event.inputs.cookies }}" | base64 -d > cookies.txt

      - name: Extract video direct URL using multiple methods
        id: extract
        shell: bash
        run: |
          URL="${{ github.event.inputs.url }}"
          echo "Processing URL: $URL"
          
          # روش 1: استفاده از yt-dlp با فلگ --get-url
          echo "Method 1: Trying yt-dlp --get-url..."
          yt-dlp --get-url --allow-unplayable-formats "$URL" > direct_urls.txt 2>&1 || true
          
          # روش 2: استفاده از yt-dlp با --dump-json برای اطلاعات کامل
          echo "Method 2: Trying yt-dlp --dump-json..."
          yt-dlp --dump-json --allow-unplayable-formats "$URL" > video_info.json 2>&1 || true
          
          # روش 3: استفاده از extractor-args برای اجبار به generic
          echo "Method 3: Trying generic extractor..."
          yt-dlp --extractor-args "generic:no-playlist" --get-url "$URL" >> direct_urls.txt 2>&1 || true
          
          # نمایش محتوای فایل‌ها برای دیباگ
          echo "=== direct_urls.txt content ==="
          cat direct_urls.txt
          echo "=== video_info.json content ==="
          cat video_info.json
          
          # جستجوی لینک m3u8 یا mp4 در خروجی
          if grep -E '\.(m3u8|mp4|ts|mkv|webm)' direct_urls.txt; then
            VIDEO_URL=$(grep -E '\.(m3u8|mp4|ts|mkv|webm)' direct_urls.txt | head -1)
            echo "Found video URL: $VIDEO_URL"
            echo "video_url=$VIDEO_URL" >> $GITHUB_OUTPUT
            echo "method=yt-dlp" >> $GITHUB_OUTPUT
          else
            echo "No direct URL found with yt-dlp"
          fi

      - name: Download using curl/wget if yt-dlp fails
        if: steps.extract.outputs.video_url == ''
        shell: bash
        run: |
          URL="${{ github.event.inputs.url }}"
          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"
          
          # تلاش برای یافتن ویدیو در سورس صفحه
          echo "Downloading webpage source..."
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
               -H "Accept-Language: en-US,en;q=0.5" \
               -b cookies.txt 2>/dev/null \
               "$URL" > webpage.html
          
          # جستجوی لینک‌های ویدیو در صفحه
          echo "Searching for video URLs in page..."
          grep -Eio 'https?://[^"'\''<>]+\.(mp4|m3u8|ts|mkv|webm|flv)[^"'\''<>]*' webpage.html | head -5 > found_urls.txt
          
          # استفاده از regex پیشرفته‌تر برای یافتن ویدیو
          grep -Eio '(https?://[^"'\''<>]+/(?:video|media|stream)/[^"'\''<>]+)' webpage.html >> found_urls.txt
          
          if [ -s found_urls.txt ]; then
            echo "Found video URLs:"
            cat found_urls.txt
            VIDEO_URL=$(head -1 found_urls.txt)
            echo "video_url=$VIDEO_URL" >> $GITHUB_OUTPUT
            echo "method=curl" >> $GITHUB_OUTPUT
          else
            echo "No video URL found in webpage"
            echo "video_url=" >> $GITHUB_OUTPUT
          fi

      - name: Download video file
        id: download
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"
          
          VIDEO_URL="${{ steps.extract.outputs.video_url }}"
          if [ -z "$VIDEO_URL" ]; then
            VIDEO_URL="${{ steps.extract.outputs.video_url }}"
          fi
          
          if [ -z "$VIDEO_URL" ]; then
            echo "No video URL found, aborting"
            exit 1
          fi
          
          echo "Downloading from: $VIDEO_URL"
          cd "$FOLDER"
          
          # تعیین نام فایل از URL
          FILENAME="video_$(date +%Y%m%d_%H%M%S).mp4"
          if [[ "$VIDEO_URL" == *".m3u8"* ]]; then
            # برای فایل‌های m3u8 از ffmpeg استفاده کن
            ffmpeg -i "$VIDEO_URL" -c copy -bsf:a aac_adtstoasc "$FILENAME" -y
          else
            # دانلود مستقیم با curl
            curl -L -C - -o "$FILENAME" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -b ../cookies.txt 2>/dev/null \
              "$VIDEO_URL"
          fi
          
          if [ -f "$FILENAME" ] && [ $(stat -c %s "$FILENAME") -gt 10000 ]; then
            SIZE_BYTES=$(stat -c %s "$FILENAME")
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
            echo "Download successful: $FILENAME ($SIZE_BYTES bytes)"
          else
            echo "Download failed or file too small"
            exit 1
          fi

      - name: Install RAR
        run: sudo apt-get install -y rar

      - name: Conditional split (if file > 99 MB)
        id: split
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          SIZE_BYTES="${{ steps.download.outputs.size_bytes }}"
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          THRESHOLD_MB=99

          cd "$FOLDER"

          if (( $(echo "$SIZE_MB > $THRESHOLD_MB" | bc -l) )); then
            RANDOM_HEX=$(openssl rand -hex 3)
            ARCHIVE_NAME="${{ github.event.inputs.archive_name }}_${RANDOM_HEX}"

            rar a -v95m -m5 -ep1 "${ARCHIVE_NAME}.rar" "$FILENAME"

            rm "$FILENAME"

            echo "split_done=true" >> $GITHUB_OUTPUT
            ls -lh "${ARCHIVE_NAME}.part"*.rar
          else
            echo "split_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to repository
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "$FOLDER/" || true
          
          git commit -m "Add downloaded video(s)" || echo "Nothing to commit"
          
          git push || echo "Push failed but continuing"
